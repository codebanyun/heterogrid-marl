<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeteroGrid · 三维异构对抗</title>
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#131e30;--line:#25344d;--muted:#94a5bd;--text:#e8eef7;--accent:#83e3bd;--red:#ff6d76;--blue:#65adff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0f1828}
.brand{font-size:23px;font-weight:750;letter-spacing:-.5px}.brand span{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:1px;display:block}
.badge{border:1px solid #315544;border-radius:20px;padding:6px 12px;color:var(--accent);font-size:12px}
main{display:grid;grid-template-columns:minmax(480px,1fr) 330px;gap:18px;padding:20px;max-width:1900px;margin:auto}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.panel-title{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:650}
.subtle{color:var(--muted);font-size:12px;font-weight:400}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:23px;font-weight:700}.red{color:var(--red)}.blue{color:var(--blue)}
.canvas-wrap{position:relative;height:540px;background:radial-gradient(ellipse at 50% 45%,#182b42,#0b1424 75%)}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.canvas-help{position:absolute;bottom:12px;left:16px;color:#8dabc7;font-size:12px;pointer-events:none}.legend{position:absolute;top:14px;left:16px;display:flex;gap:14px;font-size:12px;color:#c0cddf;pointer-events:none}.floating{position:absolute;right:16px;top:16px;font-size:12px;background:#0b1425b0;border:1px solid #35485d;border-radius:7px;padding:6px 10px;color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}button,.file-label{background:#24334c;border:1px solid #3a4c68;border-radius:7px;padding:8px 12px;color:var(--text);font:inherit;cursor:pointer}button:hover,.file-label:hover{background:#30425f}button.primary{background:#95e7c3;color:#0a2920;border-color:#95e7c3;font-weight:650}button:disabled{opacity:.38;cursor:default}.spacer{flex:1}
input,select{border:1px solid #384b68;border-radius:6px;background:#0d1829;color:var(--text);padding:7px 8px;width:100%;font:inherit}input[type=checkbox]{width:auto;accent-color:var(--accent)}input[type=range]{padding:0;accent-color:var(--accent)}
.body{padding:16px 18px}.field{margin-bottom:13px}.field>label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.toggle{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}.sidebar{display:flex;flex-direction:column;gap:16px}.small-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.small-grid label{font-size:11px;color:var(--muted)}.team-label{font-size:12px;margin:8px 0 4px}.hint{font-size:12px;color:var(--muted);margin:9px 0 0}.units{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.unit-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #26354a;cursor:pointer;font-size:12px}.unit-row:last-child{border:0}.unit-name{width:70px}.hpbar{height:5px;background:#28384f;flex:1;border-radius:3px;overflow:hidden}.hpbar i{height:100%;display:block}.unit-row.dead{opacity:.4}.selected{outline:1px solid var(--accent);outline-offset:3px;border-radius:3px}
#detail{font-size:12px;line-height:1.9;color:#c9d7e8}#notice{min-height:18px;font-size:12px;color:#ffbb7b;padding:0 3px;margin-top:12px}.replay{display:none;padding:0 16px 14px;gap:10px;align-items:center}.replay.active{display:flex}.replay input{flex:1}footer{padding:0 24px 20px;color:#657c99;font-size:12px}.hidden{display:none!important}
@media(max-width:1050px){main{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.canvas-wrap{height:470px}}@media(max-width:600px){main{padding:10px;gap:10px}.sidebar{display:flex}.stats{grid-template-columns:1fr 1fr}.units{grid-template-columns:1fr}.canvas-wrap{height:380px}header{padding:0 16px}.brand{font-size:20px}.legend{gap:8px;font-size:10px}}
</style>
</head>
<body>
<header><div class="brand">HeteroGrid<span>三维网格 · 异构团队 · 红蓝对抗</span></div><div class="badge" id="mode">连接中</div></header>
<main><section>
<div class="stats"><div class="stat"><label>当前时间步</label><strong id="tick">—</strong><span class="subtle" id="limit"></span></div><div class="stat"><label>红方存活</label><strong class="red" id="redCount">—</strong></div><div class="stat"><label>蓝方存活</label><strong class="blue" id="blueCount">—</strong></div><div class="stat"><label>对局状态</label><strong style="font-size:19px" id="outcome">等待</strong></div></div>
<div class="panel"><div class="panel-title">三维战场 <span class="subtle" id="mapLabel">—</span></div>
<div class="canvas-wrap"><canvas id="battle" aria-label="可旋转的三维红蓝对抗战场"></canvas><div class="legend"><span>△ 侦察</span><span>□ 打击</span><span>○ 查打一体</span></div><div class="floating" id="network">—</div><div class="canvas-help">拖动旋转 · 滚轮缩放 · 点击单元查看详情</div></div>
<div class="toolbar"><button class="primary" id="play">开始</button><button id="pause">暂停</button><button id="step">单步</button><button id="reset">重置</button><span class="spacer"></span><label class="subtle" for="speed">播放速度</label><select id="speed" style="width:88px"><option value="2">2 步/秒</option><option value="5" selected>5 步/秒</option><option value="10">10 步/秒</option><option value="20">20 步/秒</option></select><button id="cameraReset">复位视角</button></div>
<div class="toolbar" style="padding-top:8px"><label class="file-label" for="replayFile">打开回放</label><input type="file" id="replayFile" accept=".json" hidden><button id="exitReplay" class="hidden">返回实时</button><span class="subtle">回放在本地浏览器读取</span></div>
<div class="replay" id="replayControls"><span class="subtle" id="replayIndex">0</span><input id="replaySlider" type="range" min="0" max="1" value="0"></div></div>
<div class="units"><div class="panel"><div class="panel-title red">红方团队 <span class="subtle" id="redReturn">累计奖励 0</span></div><div class="body" id="redUnits"></div></div><div class="panel"><div class="panel-title blue">蓝方团队 <span class="subtle" id="blueReturn">累计奖励 0</span></div><div class="body" id="blueUnits"></div></div>
<div id="notice" role="status"></div>
</section>
<aside class="sidebar"><div class="panel"><div class="panel-title">场景设置 <span class="subtle">修改后重新开始</span></div><div class="body" id="settings">
<div class="field"><label>地图大小 X / Y / Z</label><div class="row"><input id="mapX" type="number" min="1" max="256" value="24" aria-label="地图 X"><input id="mapY" type="number" min="1" max="256" value="24" aria-label="地图 Y"><input id="mapZ" type="number" min="1" max="128" value="6" aria-label="地图 Z"></div></div>
<div class="team-label red">红方数量</div><div class="small-grid"><label>侦察<input id="redScout" type="number" min="0" max="50" value="2"></label><label>打击<input id="redStrike" type="number" min="0" max="50" value="2"></label><label>查打一体<input id="redHybrid" type="number" min="0" max="50" value="2"></label></div>
<div class="team-label blue">蓝方数量</div><div class="small-grid"><label>侦察<input id="blueScout" type="number" min="0" max="50" value="2"></label><label>打击<input id="blueStrike" type="number" min="0" max="50" value="2"></label><label>查打一体<input id="blueHybrid" type="number" min="0" max="50" value="2"></label></div>
<div class="field" style="margin-top:14px"><label for="opponent">蓝方策略</label><select id="opponent"><option value="rule">固定规则</option><option value="random">随机行动</option><option value="static">静止防守</option><option value="dummy">静止靶标</option></select></div>
<div class="field"><label for="commMode">通信方式</label><select id="commMode"><option value="distance">距离限制</option><option value="random">随机节点失联</option><option value="full">全队可通信</option><option value="none">关闭通信</option></select></div>
<div class="row"><div class="field"><label for="radius">通信半径</label><input id="radius" type="number" min="0" step="1" value="10"></div><div class="field"><label for="dropout">失联概率</label><input id="dropout" type="number" min="0" max="1" step="0.05" value="0.25"></div></div>
<div class="row"><div class="field"><label for="seed">随机种子</label><input id="seed" type="number" min="0" value="42"></div><div class="field"><label for="maxSteps">最大步数</label><input id="maxSteps" type="number" min="1" value="200"></div></div>
<button class="primary" id="apply" style="width:100%">应用设置并重置</button><p class="hint" id="demoHint">这是独立的规则策略演示。双方按合法链路共享目标报告，不执行网络训练。</p></div></div>
<div class="panel"><div class="panel-title">显示图层</div><div class="body"><label class="toggle"><input id="showLinks" type="checkbox" checked>通信可用链路</label><label class="toggle"><input id="showShots" type="checkbox" checked>攻击轨迹</label><label class="toggle"><input id="showLabels" type="checkbox" checked>单元名称</label><label class="toggle"><input id="showDead" type="checkbox">已被击败的单元</label><label class="toggle"><input id="showVision" type="checkbox">所选单元的视野与射程</label></div></div>
<div class="panel"><div class="panel-title">单元详情</div><div class="body" id="detail">点击战场中的单元或团队列表。</div></div>
</aside></main><footer>可视化独立运行。训练环境默认无渲染、无网络传输；平台名称用于区分展示，不模拟专属动力学。</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('battle'),ctx=canvas.getContext('2d');
const colors={red:'#ff6d76',blue:'#65adff'},roles={scout:'侦察',strike:'打击',hybrid:'查打一体'},platforms={uav:'无人机',usv:'无人艇',robot:'机器人',robot_dog:'机器狗'};
let frame=null,state=null,selected=null,hitPoints=[],initialized=false,busy=false;
let yaw=-0.78,pitch=0.65,zoom=1,drag=null,dragDistance=0,replay=null,replayPosition=0,replayPlaying=false,lastReplayTime=0;
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s=''){$('notice').textContent=s;}
function project(p){const m=frame.map_size, x=p[0]-(m[0]-1)/2,y=p[1]-(m[1]-1)/2,z=p[2]-(m[2]-1)/2;
 const a=Math.cos(yaw)*x-Math.sin(yaw)*y,b=Math.sin(yaw)*x+Math.cos(yaw)*y;
 const scale=Math.min(canvas.clientWidth/(Math.hypot(m[0],m[1])+8),canvas.clientHeight/(Math.hypot(m[0],m[1])*0.7+m[2]+8))*zoom;
 return {x:canvas.clientWidth/2+a*scale,y:canvas.clientHeight/2+(b*Math.sin(pitch)-z*Math.cos(pitch))*scale,depth:b*Math.cos(pitch)+z*Math.sin(pitch)};}
function line(a,b,color,width=1,dashed=false){const p=project(a),q=project(b);ctx.beginPath();ctx.setLineDash(dashed?[4,5]:[]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([]);}
function circle3d(center,radius,color){if(!radius)return;const planes=[[0,1],[0,2],[1,2]];for(const [a,b] of planes){ctx.beginPath();for(let i=0;i<=64;i++){const p=center.slice();p[a]+=radius*Math.cos(i*Math.PI/32);p[b]+=radius*Math.sin(i*Math.PI/32);const q=project(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);}ctx.strokeStyle=color;ctx.lineWidth=1;ctx.stroke();}}
function draw(){const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);hitPoints=[];if(!frame)return;
 const [nx,ny,nz]=frame.map_size,x=nx-1,y=ny-1,z=nz-1;
 const gridStep=Math.max(1,Math.ceil(Math.max(nx,ny)/24));for(let a=0;a<=x;a+=gridStep)line([a,0,0],[a,y,0],'#23394d');for(let b=0;b<=y;b+=gridStep)line([0,b,0],[x,b,0],'#23394d');
 const vertices=[[0,0,0],[x,0,0],[x,y,0],[0,y,0],[0,0,z],[x,0,z],[x,y,z],[0,y,z]];
 for(const [a,b] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])line(vertices[a],vertices[b],'#405872');
 for(const [p,text,color] of [[[x+1,0,0],'X','#ff8490'],[[0,y+1,0],'Y','#85dbbd'],[[0,0,z+1],'Z','#82baff']]){const q=project(p);ctx.fillStyle=color;ctx.font='12px system-ui';ctx.fillText(text,q.x,q.y);}
 const byId=Object.fromEntries(frame.units.map(u=>[u.id,u]));
 if($('showLinks').checked)for(const [a,b] of frame.links||[]){if(byId[a]&&byId[b])line(byId[a].position,byId[b].position,byId[a].team==='red'?'#ff6d763b':'#65adff3b',1,true);}
 const chosen=byId[selected];if(chosen&&chosen.alive&&$('showVision').checked){circle3d(chosen.position,chosen.vision,'#83e3bd66');circle3d(chosen.position,chosen.attack_range,'#ffce8066');}
 if($('showShots').checked)for(const a of frame.attacks||[])line(a.origin,a.aim,a.hit?'#ffd07c':'#a2acc080',a.hit?2:1,!a.hit);
 const units=frame.units.filter(u=>u.alive||$('showDead').checked).map(u=>({u,p:project(u.position)})).sort((a,b)=>a.p.depth-b.p.depth);
 for(const {u,p} of units){const ground=project([u.position[0],u.position[1],0]);if(u.position[2]>0)line([u.position[0],u.position[1],0],u.position,colors[u.team]+'33',1,true);
 ctx.fillStyle=colors[u.team]+'22';ctx.beginPath();ctx.ellipse(ground.x,ground.y,7,3,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=u.alive?1:0.28;ctx.fillStyle=colors[u.team];ctx.strokeStyle=u.id===selected?'#ffffff':'#101829';ctx.lineWidth=u.id===selected?2.5:1.5;ctx.beginPath();
 if(u.role==='scout'){ctx.moveTo(p.x,p.y-9);ctx.lineTo(p.x+9,p.y+7);ctx.lineTo(p.x-9,p.y+7);ctx.closePath();}else if(u.role==='strike'){ctx.rect(p.x-7,p.y-7,14,14);}else ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.stroke();
 if(!u.online&&u.alive){ctx.strokeStyle='#e8eef7';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x-10,p.y-10);ctx.lineTo(p.x+10,p.y+10);ctx.stroke();}
 ctx.fillStyle='#0a1320';ctx.fillRect(p.x-13,p.y-18,26,4);ctx.fillStyle=u.hp/u.max_hp<0.3?'#ffce80':colors[u.team];ctx.fillRect(p.x-13,p.y-18,26*Math.max(0,u.hp/u.max_hp),4);
 if($('showLabels').checked){ctx.fillStyle='#d9e5f3';ctx.font='11px system-ui';ctx.fillText(u.id,p.x+12,p.y+4);}ctx.globalAlpha=1;hitPoints.push({id:u.id,x:p.x,y:p.y});}}
function renderLists(){for(const team of ['red','blue']){const list=frame.units.filter(u=>u.team===team);$(team+'Count').textContent=list.filter(u=>u.alive).length+' / '+list.length;$(team+'Return').textContent='累计奖励 '+Number(frame.returns?.[team]||0).toFixed(2);$(team+'Units').innerHTML=list.map(u=>`<div class="unit-row ${u.alive?'':'dead'} ${u.id===selected?'selected':''}" data-unit="${escapeText(u.id)}"><span class="unit-name ${team}">${escapeText(u.id)}</span><span>${roles[u.role]||escapeText(u.role)}</span><div class="hpbar"><i style="width:${Math.max(0,100*u.hp/u.max_hp)}%;background:${colors[team]}"></i></div><span>${Math.round(u.hp)}</span></div>`).join('');}}
function detail(){const u=frame?.units.find(u=>u.id===selected);if(!u){$('detail').textContent='点击战场中的单元或团队列表。';return;}$('detail').innerHTML=`<strong style="color:${colors[u.team]}">${escapeText(u.id)} · ${roles[u.role]}</strong><br>平台：${platforms[u.platform]||escapeText(u.platform)}<br>坐标：(${u.position.join(', ')})<br>生命值：${u.hp} / ${u.max_hp}<br>视野 / 射程：${u.vision} / ${u.attack_range}<br>攻击伤害：${u.damage}<br>通信：${u.online?'可用':'不可用'}<br>状态：${u.alive?'存活':'已被击败'}`;}
function showFrame(f){frame=f;if(!f){$('outcome').textContent='等待快照';draw();return;}$('tick').textContent=f.step;$('limit').textContent=' / '+f.max_steps;$('mapLabel').textContent=f.map_size.join(' × ')+' 网格';$('outcome').textContent=f.finished?(f.winner?(f.winner==='red'?'红方胜利':'蓝方胜利'):(f.reason==='timeout'?'超时平局':'双方全灭')):'进行中';$('network').textContent={distance:'距离限制',random:'随机失联',none:'通信关闭',full:'全队通信'}[f.communication]||f.communication;renderLists();detail();draw();}
function fillSettings(s){if(!s.config)return;const c=s.config;['mapX','mapY','mapZ'].forEach((id,i)=>$(id).value=c.map_size[i]);for(const team of ['red','blue'])for(const [role,suffix] of [['scout','Scout'],['strike','Strike'],['hybrid','Hybrid']])$(team+suffix).value=c[team].filter(u=>u.role===role).length;$('opponent').value=c.opponent;$('commMode').value=c.communication;$('radius').value=c.comm_radius;$('dropout').value=c.dropout_probability;$('maxSteps').value=c.max_steps;$('seed').value=s.seed;$('speed').value=s.fps;}
function controls(){const monitor=state?.mode==='snapshot',inReplay=!!replay;for(const id of ['apply','reset'])$(id).disabled=monitor||inReplay;for(const id of ['play','pause','step'])$(id).disabled=monitor&&!inReplay;$('settings').querySelectorAll('input,select').forEach(el=>el.disabled=monitor||inReplay);$('demoHint').textContent=monitor?'只读查看独立评估进程发布的状态。':'这是独立的规则策略演示。双方按合法链路共享目标报告，不执行网络训练。';$('play').textContent=inReplay?(replayPlaying?'播放中':'播放回放'):(state?.running?'运行中':'开始');$('mode').textContent=inReplay?'回放模式':monitor?'独立评估监看':'规则策略演示';}
async function poll(){if(busy||replay)return;try{const response=await fetch('/api/state');if(!response.ok)throw Error('服务器响应 '+response.status);state=await response.json();if(!initialized&&state.config){fillSettings(state);initialized=true;}showFrame(state.frame);controls();notice(state.error||'');}catch(e){notice('连接失败：'+e.message);}}
async function command(action,extra={}){busy=true;try{const response=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const result=await response.json();if(!response.ok)throw Error(result.error);state=result;showFrame(state.frame);controls();notice(state.error||'');if(action==='configure'||action==='reset')fillSettings(state);}catch(e){notice(e.message);}finally{busy=false;}}
function replaySeek(index){replayPosition=Math.max(0,Math.min(replay.frames.length-1,index));$('replaySlider').value=replayPosition;$('replayIndex').textContent=(replayPosition+1)+' / '+replay.frames.length;showFrame(replay.frames[replayPosition]);}
$('play').onclick=()=>{if(replay){if(replayPosition>=replay.frames.length-1)replaySeek(0);replayPlaying=true;lastReplayTime=performance.now();controls();}else command('play');};$('pause').onclick=()=>{if(replay){replayPlaying=false;controls();}else command('pause');};$('step').onclick=()=>{if(replay){replayPlaying=false;replaySeek(replayPosition+1);controls();}else command('step');};$('reset').onclick=()=>command('reset',{seed:Number($('seed').value)});
$('speed').onchange=()=>{if(!replay&&state?.mode!=='snapshot')command('speed',{fps:Number($('speed').value)});};$('cameraReset').onclick=()=>{yaw=-0.78;pitch=0.65;zoom=1;draw();};
$('apply').onclick=()=>{const n=id=>Number($(id).value);const makeTeam=team=>{const roster=[],p=['uav','usv','robot','robot_dog'];for(const [role,suffix] of [['scout','Scout'],['strike','Strike'],['hybrid','Hybrid']]){const count=n(team+suffix);if(!Number.isInteger(count)||count<0||count>50)throw Error('单类数量必须是 0 到 50 的整数');for(let i=0;i<count;i++)roster.push({role,platform:p[roster.length%p.length]});}return roster;};try{const config={...state.config,map_size:[n('mapX'),n('mapY'),n('mapZ')],red:makeTeam('red'),blue:makeTeam('blue'),opponent:$('opponent').value,communication:$('commMode').value,comm_radius:n('radius'),dropout_probability:n('dropout'),max_steps:n('maxSteps')};command('configure',{config,seed:n('seed')});}catch(e){notice(e.message);}};
for(const id of ['showLinks','showShots','showLabels','showDead','showVision'])$(id).onchange=draw;
document.querySelectorAll('#redUnits,#blueUnits').forEach(el=>el.onclick=e=>{const row=e.target.closest('[data-unit]');if(row){selected=row.dataset.unit;renderLists();detail();draw();}});
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};dragDistance=0;canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;dragDistance+=Math.abs(dx)+Math.abs(dy);yaw+=dx*0.008;pitch=Math.max(0.15,Math.min(1.4,pitch+dy*0.005));drag={x:e.clientX,y:e.clientY};draw();};canvas.onpointerup=e=>{if(dragDistance<6){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const found=hitPoints.slice().reverse().find(p=>Math.hypot(p.x-x,p.y-y)<17);if(found){selected=found.id;renderLists();detail();draw();}}drag=null;};canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(4,zoom*Math.exp(-e.deltaY*0.001)));draw();};
$('replayFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.schema_version!==1||!Array.isArray(data.frames)||!data.frames.length||data.frames.some(f=>!Array.isArray(f.units)||!Array.isArray(f.map_size)))throw Error('请选择 HeteroGrid 导出的回放 JSON');if(state?.mode==='demo')await command('pause');replay=data;replayPlaying=false;$('exitReplay').classList.remove('hidden');$('replayControls').classList.add('active');$('replaySlider').max=data.frames.length-1;replaySeek(0);controls();notice('已载入 '+file.name);}catch(err){notice('回放读取失败：'+err.message);}e.target.value='';};
$('replaySlider').oninput=e=>{replayPlaying=false;replaySeek(Number(e.target.value));controls();};$('exitReplay').onclick=()=>{replay=null;replayPlaying=false;$('exitReplay').classList.add('hidden');$('replayControls').classList.remove('active');poll();};
function animate(now){if(replay&&replayPlaying&&now-lastReplayTime>=1000/Number($('speed').value)){replaySeek(replayPosition+1);lastReplayTime=now;if(replayPosition>=replay.frames.length-1){replayPlaying=false;controls();}}requestAnimationFrame(animate);}requestAnimationFrame(animate);new ResizeObserver(draw).observe(canvas);poll();setInterval(poll,250);
</script>
</body></html>
