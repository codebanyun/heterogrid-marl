[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heterogrid-marl"
version = "0.1.0"
description = "A lightweight heterogeneous 3D grid combat environment for MARL"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=1.0,<2", "pettingzoo>=1.24,<2"]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]

[project.scripts]
heterogrid-viewer = "heterogrid.viewer:main"
heterogrid-rollout = "heterogrid.rollout:main"

[tool.setuptools.packages.find]
include = ["heterogrid*"]

[tool.setuptools.package-data]
heterogrid = ["static/*.html"]
